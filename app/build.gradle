plugins { id 'com.android.application' }

def releaseKeys = new Properties()
def releaseProperties = rootProject.file('.private/signing.properties')
if (releaseProperties.exists()) {
    releaseProperties.withInputStream { releaseKeys.load(it) }
}

android {
    namespace 'local.quicklens'
    compileSdk 34
    defaultConfig {
        applicationId 'local.quicklens'
        minSdk 34
        targetSdk 34
        versionCode 3
        versionName '0.3.0'
    }
    if (!releaseKeys.isEmpty()) {
        signingConfigs {
            release {
                storeFile rootProject.file(releaseKeys['storeFile'])
                storePassword releaseKeys['storePassword']
                keyAlias releaseKeys['keyAlias']
                keyPassword releaseKeys['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (!releaseKeys.isEmpty()) signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lint { abortOnError true }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
